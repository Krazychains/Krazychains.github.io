  /* Publish a new version of the site with `next` as its data. Resolves true on success
     (the page then reloads itself), false if it couldn't be saved. */
  function publishState(next){
    if (!artifactNS) { showToast('Publishing isn’t available in this view.', true); return Promise.resolve(false); }
    var html = buildHTML(next);
    if (!html) { showToast('Couldn’t publish: the page styles are missing. Please reload and try again.', true); return Promise.resolve(false); }
    showToast('Saving…');
    return artifactNS.publish(html).then(function(){ return true; }).catch(function(err){
      if (err && err.code === 'not_writer') {
        canEdit = false; editMode = false; draft = null;
        showToast('You don’t have permission to publish changes to this site.', true);
        render();
      } else if (err && err.code === 'conflict') {
        showToast('Someone else just published a change — reloading.', true);
      } else {
        showToast('Couldn’t save. Please try again.', true);
      }
      return false;
    });
  }

  function uploadErrorText(err){
    var code = err && err.code;
    if (code === 'too_large') return 'That photo is too large. Try a smaller one.';
    if (code === 'unsupported_type') return 'That file type isn\'t supported. Use a JPG, PNG, WebP or GIF photo.';
    if (code === 'quota_or_state') return 'The site\'s photo storage is full.';
    if (code === 'rate_limited') return 'Too many uploads at once — wait a moment and try again.';
    if (code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') return 'Photo upload isn\'t available right now.';
    return 'Upload failed. Please try again.';
  }

  /* Shrink big phone photos before upload (keeps the site fast). PNGs stay PNG, GIFs untouched. */
  function prepareImage(file){
    return new Promise(function(resolve){
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { resolve(file); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 1600;
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, max / Math.max(w, h));
        if (scale === 1 && file.size < 1.5 * 1024 * 1024) { URL.revokeObjectURL(url); resolve(file); return; }
        try {
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * scale));
          c.height = Math.max(1, Math.round(h * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          var outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          c.toBlob(function(b){ resolve(b || file); }, outType, 0.86);
        } catch (e) { URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  /* Wire one photo field. `onChange(value)` fires whenever the stored value changes. */
  function wireImageField(id, onChange){
    var input = document.getElementById(id);
    if (!input) return;
    var preview = document.getElementById(id+'-preview');
    var status = document.getElementById(id+'-status');
    var clearBtn = document.getElementById(id+'-clear');
    var pick = document.getElementById(id+'-pick');
    var fileEl = document.getElementById(id+'-file');

    function refresh(){
      var v = input.value.trim();
      preview.innerHTML = '';
      if (v) {
        var im = document.createElement('img');
        im.alt = '';
        im.src = v;
        im.onerror = function(){ preview.textContent = 'Can\'t load this image'; };
        preview.appendChild(im);
      } else {
        preview.textContent = 'No photo';
      }
      if (clearBtn) clearBtn.hidden = !v;
    }
    function setValue(v){
      input.value = v;
      refresh();
      onChange(v);
    }
    input.addEventListener('input', function(){ refresh(); onChange(input.value); });
    if (clearBtn) clearBtn.addEventListener('click', function(){ status.textContent=''; status.className='img-status'; setValue(''); });

    if (pick && fileEl) {
      pick.addEventListener('click', function(){ fileEl.click(); });
      fileEl.addEventListener('change', function(){
        var file = fileEl.files && fileEl.files[0];
        fileEl.value = '';
        if (!file) return;
        if (!/^image\//.test(file.type)) { status.className='img-status err'; status.textContent='Please choose an image file.'; return; }
        pick.disabled = true;
        status.className = 'img-status';
        status.textContent = 'Uploading…';
        prepareImage(file).then(function(blob){
          var opts = blob.type ? undefined : { type: file.type };
          return assetsNS.upload(blob, opts);
        }).then(function(res){
          // Store the durable path (not the temporary URL) so it works on every page version.
          setValue('/_blob/' + res.id);
          status.textContent = 'Photo added. Remember to Save & publish.';
        }).catch(function(err){
          status.className = 'img-status err';
          status.textContent = uploadErrorText(err);
        }).then(function(){ pick.disabled = false; });
      });
    }
  }

        '<button class="btn" id="m-save">'+(existing?'Save changes':'Add keychain')+'</button>'+
      '</div>'+
    '</div>';
    document.body.appendChild(backdrop);
    wireImageField('m-image', function(){});
    backdrop.addEventListener('click', function(e){ if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('m-cancel').addEventListener('click', function(){ backdrop.remove(); });
    document.getElementById('m-save').addEventListener('click', function(){
      var name = document.getElementById('m-name').value.trim();
      if (!name) { alert('Give the keychain a name first.'); return; }
      var updated = {
        id: l.id,
        name: name,
        price: document.getElementById('m-price').value.trim(),
        tag: document.getElementById('m-tag').value.trim(),
        description: document.getElementById('m-desc').value.trim(),
        image: document.getElementById('m-image').value.trim()
      };
      if (existing) {
        draft.listings = draft.listings.map(function(x){ return x.id === l.id ? updated : x; });
      } else {
        draft.listings.push(updated);
      }
      backdrop.remove();
      render();
    });
  }

  /* ---------------- persistence ---------------- */

  /* Rebuild the whole page for publishing: the platform's small head (meta + reset),
     then the page itself (title, fonts, styles, markup, data, script) inside the body. */
  function buildHTML(s){
    var styleEl = document.getElementById('page-style');
    if (!styleEl) return null; // never publish a page without its styles
    var head = '<meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">';
    var reset = '';
    var kids = document.head ? Array.prototype.slice.call(document.head.children) : [];
    kids.forEach(function(el){
      if (el.tagName === 'META' && el.hasAttribute('charset')) head = head.replace(/<meta charset="[^"]*">/, el.outerHTML);
    });
    var viewportEl = document.head && document.head.querySelector('meta[name="viewport"]');
    if (viewportEl) head = head.replace(/<meta name="viewport"[^>]*>/, viewportEl.outerHTML);
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].tagName === 'STYLE' && kids[i].id !== 'page-style') { reset = kids[i].outerHTML; break; }
    }
    if (!reset) reset = '<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>';
    var title = '<title>'+esc(s.business.name)+' \u2014 Handmade Keychains</title>';
    var fonts = '<link rel="preconnect" href="https://fonts.googleapis.com">'+
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
      '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">';
    var dataScript = '<script id="site-data" type="application/json">'+JSON.stringify(s).replace(/</g,'\\u003c')+'<\/script>';
    return '<!doctype html><html lang="en"><head>'+head+reset+'</head><body>'+
      title+fonts+styleEl.outerHTML+
      '<div id="app"></div>'+dataScript+APP_SCRIPT_HTML+
      '</body></html>';
  }

  function showToast(msg, isErr){
    var t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3200);
  }

  function saveSite(){
    if (!artifactNS) { showToast('Publishing isn\u2019t available in this view.', true); return; }
    savingState = 'saving';
    render();
    var html = buildHTML(draft);
    if (!html) {
      savingState = 'error';
      showToast('Couldn’t publish: the page styles are missing. Please reload and try again.', true);
      render();
      return;
    }
    artifactNS.publish(html).then(function(){
      savingState = 'saved';
      // a successful publish reloads this view automatically
    }).catch(function(err){
      savingState = 'error';
      if (err && err.code === 'not_writer') {
        canEdit = false; editMode = false; draft = null;
        showToast('You don\u2019t have permission to publish changes to this site.', true);
        render();
        return;
      }
      if (err && err.code === 'conflict') {
        showToast('Someone else just published a change \u2014 reloading.', true);
        return; // the view will reload on its own
      }
      showToast('Couldn\u2019t publish changes. Please try again.', true);
      render();
    });
  }

  /* ---------------- boot ---------------- */

  function boot(){
    render();
    Promise.resolve(window.claude && window.claude.use ? window.claude.use('artifact') : null).then(function(ns){
      artifactNS = ns;
    }).catch(function(){ artifactNS = null; });
    Promise.resolve(window.claude && window.claude.use ? window.claude.use('assets') : null).then(function(ns){
      assetsNS = ns;
      if (editMode || (canEdit && route.view === 'listing')) render();
    }).catch(function(){ assetsNS = null; });
    Promise.resolve(window.claude && window.claude.use ? window.claude.use('user') : null).then(function(userNS){
      if (!userNS) return false;
      return userNS.canEdit();
    }).then(function(result){
      canEdit = !!result;
      writerKnown = true;
      render();
    }).catch(function(){ canEdit = false; render(); });
  }

  boot();
})();
</script></body></html>
